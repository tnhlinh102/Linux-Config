# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# My tmux plugins
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-cpu'

#Default

set -g default-terminal "screen-256color"
set -ag terminal-overrides "xterm-256colors=256"

set -g status-bg "colour235"
set -g status-fg white

set -g status-right-length 250
set -g status-right "#[fg=cyan]NET: #(~/.tmux/scripts/net-speed.sh) #[fg=white]| #[fg=colour129]RAM: #{ram_percentage} #[fg=white]| #[fg=red]CPU: #{cpu_percentage} #[fg=white]| #[fg=silver]%a, %d %b %H:%M #[fg=black,bg=colour14] #(whoami)@#h"

setw -g window-status-current-style fg=black
setw -g window-status-style fg=brightblue
set -g pane-active-border-style bg=default,fg=green
set -g pane-border-style fg=red

unbind %
unbind '"'

set-option -g prefix C-Space
bind-key C-Space send-prefix

bind '\' split-window -h
bind '-' split-window -v

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 15
bind -r J resize-pane -D 15
bind -r K resize-pane -U 15
bind -r L resize-pane -R 15

bind n swap-pane -D
bind m swap-pane -U

bind -n C-z resize-pane -Z

bind r source-file ~/.tmux.conf\; display "Reloaded!"

set -g focus-events on

# Linux only
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down

# To copy, left click and drag to highlight text in yellow, 
# once you release left click yellow text will disappear and will automatically be available in clibboard
# # Use vim keybindings in copy mode
setw -g mode-keys vi
# Update default binding of Enter to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection c"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
